<section id="todo_list">
  <h1 id="list_title">Your To do</h1>

  <!-- input task -->
  <div id="task_actions">
    <input type="text" id="task_name" placeholder="Enter your task name" #taskName>

    <!-- 1. Enviamos el valor que el  usuairo escribió -->
    <!-- 2. Después de enviar, le decimos que el campo lo deje vacío -->
    <button id="task_add" (click)="addTask(taskName.value); taskName.value=''" >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!--task list-->
  <ul id="tasks_list">
  <!-- 1.Recorremos el arreglo y toma como su identificador por track: el mismo elemento task-->
  @for (task of tasks; track task; let index = $index) {
    <!-- 2. Mostrarlo cada tarea -->
    <li class="tasks">
      <!-- 3, usando la propery binding - le decimos que según su estado, que marque o lo desmarque -->
      <input type="checkbox" (click)="complete(index)" [checked]="task.status">
      <!-- 4. class binding - agrega solamente el css si es verdadero, si no, no lo agregues -->
      <p class="task_Name" [class.completed_task]="task.status"> {{ task.name }} </p>
      <i (click)="taskDelete(index)" class="fa-solid fa-x task_delete"></i>
    </li>
  }
  </ul>

  <span id="task_counter">Total de tareas: {{ tasks.length }} </span>
  <span id="task_counter">Tareas completadas: {{  doneTasksCount }} </span>
  <span id="task_counter">Tareas pendientes: {{ pendingTasksCount }} </span>


</section>
